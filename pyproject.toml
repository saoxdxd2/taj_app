[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taj_froid"
version = "1.0.0"
description = "ERP System for Taj Froid - Inventory, Sales, and Financial Management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.9.2",
    "sqlalchemy>=2.0.52",
    "alembic>=1.17.2",
    "aiosqlite>=0.21.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.11.0",
    "argon2-cffi>=25.1.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib>=1.7.4",
    "cryptography>=46.0.3",
    "httpx>=0.28.1",
    "reportlab>=4.4.6",
    "loguru>=0.7.3",
    "structlog>=25.5.0",
    "python-dateutil>=2.9.0.post0",
    "tenacity>=9.1.2",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.3.0",
    "pytest-benchmark>=5.2",
    "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

# Type checking is advisory, not a gate: the UI layer and the SQLAlchemy
# models are only partially annotated, and making them strict would be a
# large refactor. The business/service layer is the part we hold to.
[tool.mypy]
python_version = "3.12"
files = [
    "src/modules",
    "src/core",
    "src/database",
    "src/security",
    "src/dto",
]
# The module packages deliberately have no __init__.py (namespace packages),
# so mypy needs this to resolve `services` files to their real module paths.
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
# Reports findings without failing the build; tighten over time.
warn_return_any = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
exclude = ["^src/ui/"]

[[tool.mypy.overrides]]
module = ["src.modules.*.models", "src.database.base"]
# SQLAlchemy declarative models generate their own annotations.
ignore_errors = true
